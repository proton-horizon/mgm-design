name: Publish designs

on:
  push:
    branches: [main]
    paths:
      - 'design/**'
      - '.github/workflows/design-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: proton-horizon/mgm-design
          ref: main
          path: .mgm-design-publisher
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .mgm-design-publisher/package.json
      - name: Install preview capture dependencies
        working-directory: .mgm-design-publisher
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Publish browser-ready design bundle
        env:
          MGM_SITE_URL: ${{ vars.MGM_SITE_URL }}
          MGM_PROJECT_ID: ${{ vars.MGM_PROJECT_ID }}
          MGM_PUBLISH_TOKEN: ${{ secrets.MGM_PUBLISH_TOKEN }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -ge 1000 ]; then
            echo 'Too many reruns for the publication ordering convention.' >&2
            exit 1
          fi
          export MGM_PUBLISH_SEQUENCE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          node .mgm-design-publisher/scripts/publish.mjs --directory design --previews
